# Operator configuration for the PR-pipeline control plane.
#
# [policy] governs the reviewer admission gate. A PR whose diff edits files
# that steer the reviewer (CLAUDE.md, AGENTS.md, the review checklists) is
# escalated to a human instead of auto-reviewed — the reviewer runs on the PR's
# own worktree, so it would review under instructions the PR itself supplied.
#
# This file ships with the gate ON, and it is the shipped default precisely
# because it is a trust boundary: an install inherits whatever is committed
# here, so opting every adopter out by default would make the choice for them.
# An operator who accepts that boundary sets allow_touching = true in their own
# copy. The human merge gate after ai:ready-for-human still stands either way.
#
# A missing or malformed config.toml keeps the conservative gate (fail closed).
[policy]
allow_touching = false
