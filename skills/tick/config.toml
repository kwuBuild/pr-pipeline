# The PACKAGED FLOOR for the PR-pipeline control plane. Layer 1 of the
# configuration order, and read-only.
#
# THIS IS NOT WHERE YOU PUT YOUR SETTINGS. Operator configuration lives in
# ~/.claude/pr-pipeline/config.toml (honouring $CLAUDE_CONFIG_DIR). A plugin
# install lands at ~/.claude/plugins/cache/<marketplace>/<plugin>/<hash>/ and
# `/plugin update` installs the next version at a *different* hash, so a value
# written here is silently discarded on every upgrade — including verification
# grants, which would leave the next dispatch running with no verification while
# still awarding ai:ready-for-human. The resolver reports an [operator],
# [repos.*] or [scan] table found here as a configuration error rather than
# reading it.
#
# The layers, later overriding earlier:
#
#   1. this file                     the shipped floor
#   2. [defaults]                    operator-wide, in the operator's own config
#   3. [repos."owner/name"]          per-repository overrides
#   4. environment variables         PIPELINE_TRUSTED_AUTHOR (one-off runs)
#   5. explicit CLI flags            --permission-mode and friends
#
# Lists replace wholesale; they never merge. An operator narrowing a grant for
# one target is the direction that matters for a permission list.
#
# $PR_PIPELINE_CONFIG and $CLAUDE_CONFIG_DIR must name an absolute location. A
# relative one is refused at startup: the tick changes directory after it starts,
# and an engine runs with its cwd inside a checkout of the PR under review.
#
# The operator's file looks like this:
#
#   [operator]
#   login = "your-github-login"
#
#   [defaults]
#   allow_touching  = false
#   checklist_paths = []
#   verify_tools    = ["uv run pytest *"]
#   base_ref        = ""
#   permission_mode = "dontAsk"
#
#   [scan]
#   repos = []                        # empty or absent = unrestricted
#
#   [repos."owner/notes-app"]
#   base_ref     = "master"
#   verify_tools = ["npm test *"]

# The target comes from the working directory's Git remote. PIPELINE_REPO
# selects a matching local remote; no repository identity belongs in config.
# Deprecated login fallback only; configure [operator] login in your own file.
[target]
trusted_author = ""

# The shipped floor for every per-target setting. Each key here is overridable
# in the operator's [defaults] and again in their [repos."owner/name"].
[defaults]
# allow_touching governs the reviewer admission gate. A PR whose diff edits
# files that steer the reviewer (CLAUDE.md, AGENTS.md, the review checklists,
# the pipeline's own config/pipeline.py/tick.py) is escalated to a human instead
# of auto-reviewed — the reviewer runs on the PR's own worktree, so it would
# otherwise review under instructions the PR itself supplied.
#
# The gate ships ON, and that is the shipped floor precisely because it is a
# trust boundary: an install inherits whatever is written here, so opting every
# adopter out by default would make the choice for them. An operator who accepts
# that boundary sets allow_touching = true in their own config. The human merge
# gate after ai:ready-for-human still stands either way.
#
# A missing or malformed config keeps the conservative gate (fail closed).
allow_touching = false

# checklist_paths names the target repo's *own* reviewer-governing docs, as
# repo-relative paths. CLAUDE.md and AGENTS.md are matched by basename at any
# depth and need no entry here. Empty is correct for a repo with no separate
# checklists — and a path pinned in this file would be one repo's, dead in every
# other install, while making an adopter's gate look configured when it is not.
#
# These are paths to *block*, so unlike every other list here the empty state is
# the permissive one. A malformed value is therefore a startup error, and until
# the tick stops the gate keeps every usable path any layer named: a typo in a
# per-repository override must not quietly unprotect a valid [defaults] list.
checklist_paths = []

# The verification commands an engine is permitted to run, as Bash permission
# bodies (each is wrapped in `Bash(...)`). This is a permission grant, not an
# instruction: the engine prompts tell the engine to run the verification
# commands the target repo's own CLAUDE.md/AGENTS.md prescribe. But engines run
# under an exact allowlist, never a glob, so a command that is not granted here
# is denied rather than run.
#
# Replace this list wholesale for a non-Python stack. A trailing ` *` allows
# arguments; without it only the bare command is permitted. An entry containing
# a parenthesis or newline is dropped — it would break out of the allowlist
# entry and widen the boundary. A value that is not a list of strings is a
# startup error, which is deliberately *not* the same state as an empty list:
# read as empty, one typo would dispatch an unverified PR and still promote it.
#
# This list is the *only* source of the shipped grants. An explicitly empty
# `verify_tools` — in [defaults] or for one repository — grants nothing, because
# a permission grant an operator cannot narrow to nothing is not a grant they
# control.
verify_tools = [
    "uv run pytest *",
    "uv run ruff *",
    "uv run pyright",
    "npm --prefix frontend *",
]

# The base branch the implementer branches from and targets its PR at. Blank
# means "resolve the target's default branch"; until that resolution lands the
# dispatch falls back to `main`. A malformed value is a startup error naming the
# key — there is no conservative branch to fall back to, and silently picking
# one would target a branch the operator never named.
base_ref = ""

# The engine `--permission-mode`: "dontAsk" (an exact allowlist, nothing else
# runs) or the experimental classifier-gated "auto". The floor is the
# conservative one; `--permission-mode` on a single run outranks it. Blank is
# not one of the values — unlike base_ref, it names nothing — and is a startup
# error rather than a ValueError raised after a dispatch lease already exists.
permission_mode = "dontAsk"
