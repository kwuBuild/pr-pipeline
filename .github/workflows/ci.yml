name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The runtime contract is "stdlib only, Python >= 3.11". Prove it on both
    # supported platforms and at both ends of the version range, with no uv and
    # no project dependency install -- an accidental third-party import or a
    # 3.12+ syntax feature has to fail here rather than on an adopter's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # pytest only. Installing anything else would defeat the point of the job:
      # the suite must pass without the pipeline's own code gaining a dependency.
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Test
        run: python -m pytest skills/ -q

  shellcheck:
    # status.sh and preflight.sh carry real control-flow: interpreter
    # resolution, path anchoring, and probe gating. They are shipped to other
    # people's machines, so lint them rather than discovering a quoting bug in
    # someone else's dashboard.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Syntax check
        run: |
          bash -n skills/pr-pipeline-tick/preflight.sh
          bash -n skills/pr-pipeline-status/status.sh

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=error \
            skills/pr-pipeline-tick/preflight.sh \
            skills/pr-pipeline-status/status.sh
